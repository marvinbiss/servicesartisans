int de robinet, remplacer un flexible de douche ou déboucher un siphon avec une ventouse. En revanche, toute intervention sur les canalisations encastrées, le chauffe-eau ou l'arrivée d'eau principale doit être confiée à un professionnel pour des raisons de sécurité et d'assurance.\"}},{\"@type\":\"Question\",\"name\":\"Le plombier doit-il fournir une facture ?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Oui, c'est obligatoire pour toute prestation supérieure à 25 €. La facture doit mentionner le détail des travaux, le prix unitaire des pièces, le taux horaire de la main-d'œuvre et la TVA appliquée (10 % pour la rénovation, 20 % pour le neuf). Conservez-la précieusement pour la garantie.\"}},{\"@type\":\"Question\",\"name\":\"Que faire en cas de fuite d'eau la nuit ?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Coupez immédiatement l'arrivée d'eau au compteur général, généralement situé dans la cave ou à l'extérieur du logement. Placez des récipients sous la fuite et épongez l'eau stagnante pour limiter les dégâts. Contactez ensuite un plombier d'urgence ; les majorations nocturnes et de week-end varient de 50 à 100 % du tarif de base.\"}},{\"@type\":\"Question\",\"name\":\"Comment déboucher un évier naturellement ?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Versez un mélange de bicarbonate de soude (6 cuillères à soupe) et de vinaigre blanc (25 cl) dans la canalisation, laissez agir 30 minutes puis rincez à l'eau bouillante. Si le bouchon persiste, utilisez une ventouse ou un furet manuel. Si ces méthodes échouent, faites appel à un plombier qui pourra utiliser un furet électrique ou un hydrocurage.\"}},{\"@type\":\"Question\",\"name\":\"Quel est le coût d'un remplacement de chauffe-eau ?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Le remplacement d'un chauffe-eau électrique de 200 litres coûte entre 800 et 1 500 € (fourniture + pose), tandis qu'un chauffe-eau thermodynamique revient à 2 500 à 4 500 €. Le prix dépend du type (électrique, gaz, thermodynamique, solaire), de la capacité et de l'accessibilité de l'installation. Un chauffe-eau thermodynamique permet d'économiser 40 à 50 % sur la facture d'eau chaude par rapport à un chauffe-eau électrique classique (source : ADEME).\"}},{\"@type\":\"Question\",\"name\":\"Quelle est la durée de vie d'une installation de plomberie ?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Les canalisations en cuivre durent 50 à 80 ans, celles en PER (polyéthylène réticulé) environ 50 ans, tandis que les tuyaux en plomb (interdits depuis 1995) doivent être remplacés. Un chauffe-eau a une durée de vie de 10 à 15 ans et les robinetteries de 15 à 20 ans. Un entretien régulier (détartrage, vérification des joints) prolonge significativement la durée de vie de l'installation.\"}}]}"])</script><script>self.__next_f.push([1,"27:T4f9,{\"@context\":\"https://schema.org\",\"@type\":\"ItemList\",\"name\":\"Tarifs Plombier en France\",\"description\":\"Liste des prestations et prix indicatifs pour Plombier\",\"numberOfItems\":8,\"itemListElement\":[{\"@type\":\"ListItem\",\"position\":1,\"name\":\"Débouchage de canalisation\",\"url\":\"https://servicesartisans.fr/tarifs/plombier\"},{\"@type\":\"ListItem\",\"position\":2,\"name\":\"Remplacement d'un chauffe-eau\",\"url\":\"https://servicesartisans.fr/tarifs/plombier\"},{\"@type\":\"ListItem\",\"position\":3,\"name\":\"Réparation de fuite d'eau\",\"url\":\"https://servicesartisans.fr/tarifs/plombier\"},{\"@type\":\"ListItem\",\"position\":4,\"name\":\"Installation d'un WC\",\"url\":\"https://servicesartisans.fr/tarifs/plombier\"},{\"@type\":\"ListItem\",\"position\":5,\"name\":\"Pose d'un robinet mitigeur\",\"url\":\"https://servicesartisans.fr/tarifs/plombier\"},{\"@type\":\"ListItem\",\"position\":6,\"name\":\"Remplacement d'un ballon d'eau chaude\",\"url\":\"https://servicesartisans.fr/tarifs/plombier\"},{\"@type\":\"ListItem\",\"position\":7,\"name\":\"Détection de fuite non destructive (gaz traceur ou camé
