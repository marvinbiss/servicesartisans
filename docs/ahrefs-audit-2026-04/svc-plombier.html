49b63.js?dpl=dpl_6mfcqSEU4WFVH4NFoCVBmYWxds7s\",\"2333\",\"static/chunks/2333-fe0e591013579753.js?dpl=dpl_6mfcqSEU4WFVH4NFoCVBmYWxds7s\",\"8398\",\"static/chunks/8398-3281b7b3500ba628.js?dpl=dpl_6mfcqSEU4WFVH4NFoCVBmYWxds7s\",\"7346\",\"static/chunks/7346-bde5bb5066a1e28a.js?dpl=dpl_6mfcqSEU4WFVH4NFoCVBmYWxds7s\",\"8473\",\"static/chunks/8473-3d6a094aa37d035e.js?dpl=dpl_6mfcqSEU4WFVH4NFoCVBmYWxds7s\",\"501\",\"static/chunks/501-b794e55e4c495cb1.js?dpl=dpl_6mfcqSEU4WFVH4NFoCVBmYWxds7s\",\"8119\",\"static/chunks/8119-60cd7472e5636677.js?dpl=dpl_6mfcqSEU4WFVH4NFoCVBmYWxds7s\",\"8516\",\"static/chunks/app/(public)/services/%5Bservice%5D/page-8b3c3393db04ab38.js?dpl=dpl_6mfcqSEU4WFVH4NFoCVBmYWxds7s\"],\"default\"]\n28:Tef4,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@type\":\"FAQPage\",\"mainEntity\":[{\"@type\":\"Question\",\"name\":\"Combien coûte une intervention de plombier en urgence ?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Une intervention d'urgence coûte en moyenne entre 150 et 400 €, avec des majorations possibles la nuit (+50 à 100 %), le week-end (+25 à 50 %) et les jours fériés (+50 à 100 %). Exigez toujours un devis avant que le plombier ne commence les travaux, même en urgence.\"}},{\"@type\":\"Question\",\"name\":\"Comment savoir si mon plombier est fiable ?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Vérifiez son numéro SIRET sur le site de l'INSEE, son inscription au registre des métiers, et demandez une copie de son assurance décennale. Un plombier sérieux fournit ces documents sans difficulté. Consultez également les avis en ligne et demandez des références de chantiers récents.\"}},{\"@type\":\"Question\",\"name\":\"Quels travaux de plomberie puis-je faire moi-même ?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Vous pouvez changer un joint de robinet, remplacer un flexible de douche ou déboucher un siphon avec une ventouse. En revanche, toute intervention sur les canalisations encastrées, le chauffe-eau ou l'arrivée d'eau principale doit être confiée à un professionnel pour des raisons de sécurité et d'assurance.\"}},{\"@type\":\"Question\",\"name\":\"Le plombier doit-il fournir une facture ?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Oui, c'est obligatoire pour toute prestation supérieure à 25 €. La facture doit mentionner le détail des travaux, le prix unitaire des pièces, le taux horaire de la main-d'œuvre et la TVA appliquée (10 % pour la rénovation, 20 % pour le neuf). Conservez-la précieusement pour la garantie.\"}},{\"@type\":\"Question\",\"name\":\"Que faire en cas de fuite d'eau la nuit ?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Coupez immédiatement l'arrivée d'eau au compteur général, généralement situé dans la cave ou à l'extérieur du logement. Placez des récipients sous la fuite et épongez l'eau stagnante pour limiter les dégâts. Contactez ensuite un plombier d'urgence ; les majorations nocturnes et de week-end varient de 50 à 100 % du tarif de base.\"}},{\"@type\":\"Question\",\"name\":\"Comment déboucher un évier naturellement ?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Versez un mélange de bicarbonate de soude (6 cuillères à soupe) et de vinaigre blanc (25 cl) dans la canalisation, laissez agir 30 minutes puis rincez à l'eau bouillante. Si le bouchon persiste, utilisez une ventouse ou un furet manuel. Si ces méthodes échouent, faites appel à un plombier qui pourra utiliser un furet électrique ou un hydrocurage.\"}},{\"@type\":\"Question\",\"name\":\"Quel est le coût d'un remplacement de chauffe-eau ?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Le remplacement d'un chauffe-eau électrique de 200 litres coûte entre 800 et 1 500 € (fourniture + pose), tandis qu'un chauffe-eau thermodynamique revient à 2 500 à 4 500 €. Le prix dépend du type (électrique, gaz, thermodynamique, solaire), de la capacité et de l'accessibilité de l'installation. Un chauffe-eau thermodynamique permet d'économiser 40 à 50 % sur la facture d'eau chaude par rapport à un chauffe-eau électrique classique (source : ADEME).\"}},{\"@type\":\"Question\",\"name\":\"Quelle est la durée de vie d'une installation de plomberie ?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Les canalisations en cuivre durent 50 à 80 ans, celles en PER (polyéthylène réticulé) environ 50 ans, tandis que les tuyaux en plomb (interdits depuis 1995) doivent être remplacés. Un chauffe-eau a une durée de vie de 10 à 15 ans et les robinetteries de 15 à 20 ans. Un entretien régulier (détartrage, vérification des joints) prolonge significativement la durée de vie de l'installation.\"}}]}"])</script><script>self.__next_f.push([1,"7:[\"$\",\"div\",null,{\"className\":\"min-h-screen bg-sand-50\",\"children\":[[[\"$\",\"script\",\"0\",{\"type\":\"application/ld+json\",\"nonce\":\"$undefined\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Accueil\\\",\\\"item\\\":\\\"https://servicesartisans.fr/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Services\\\",\\\"item\\\":\\\"https://servicesartisans.fr/services\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"Plombier\\\"}]}\"}}],[\"$\",\"script\",\"1\",{\"type\":\"application/ld+json\",\"nonce\":\"$undefined\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"WebPage\\\",\\\"name\\\":\\\"Plombier : comparez les professionnels\\\",\\\"url\\\":\\\"https://servicesartisans.fr/services/plombier\\\",\\\"speakable\\\":{\\\"@type\\\":\\\"SpeakableSpecification\\\",\\\"cssSelector\\\":[\\\"h1\\\",\\\"[data-speakable=\\\\\\\"true\\\\\\\"]\\\",\\\".speakable-summary\\\"]}}\"}}],[\"$\",\"script\",\"2\",{\"type\":\"application/ld+json\",\"nonce\":\"$undefined\",\"dangerouslySetInnerHTML\":{\"__html\":\
