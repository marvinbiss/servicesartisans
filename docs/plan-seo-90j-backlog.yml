# Plan SEO 90j — backlog priorisé (impact P50 clics/j × effort_heures)
# Source : stratégie CEO 2026-04-20 (Pilier 3+4) + diagnostic GSC 2026-04-30
#          + Ahrefs Bloc 1-6 (3349 KW gap, 36 CSV)
#          + Stratégie rénovation V2 fused 2026-05-04
#
# RÈGLE AHREFS-FIRST (mémoire servicesartisans-ahrefs-first-rule) :
# Chaque item DOIT citer :
#   - kw_primary : keyword principal cible
#   - volume_ahrefs : volume mensuel Ahrefs
#   - kd_ahrefs : keyword difficulty 0-100
#   - cpc_ahrefs : CPC € (intention commerciale)
#   - ahrefs_csv_source : chemin CSV + ligne (audit reproductible)
#   - cluster_pillar : Pilier #1 (annuaire) ou #2 (rénovation)
#   - leader_rank : leader actuel SERP top 10 (Hellio/Effy/Selectra/...)
#
# Convention :
#   - status : pending | in_progress | completed | blocked | killed
#   - dod : commande shell qui retourne exit 0 si chantier validé
#   - impact_clics_j_p50 : projection P50 ajout clics/jour à M+3
#                          = volume_ahrefs × CTR_p50 × indexation_rate
#   - effort_hours : estimation Ralph-coder solo (sans review humaine)
#   - blocked_by : liste IDs items bloquants
#   - human_required : false = full Ralph auto, true = besoin Marvin
#
# Tri impact/effort = ROI horaire. Loop pioche le top item disponible
# (status=pending, blocked_by tous completed, human_required=false).
#
# Budget Ahrefs : 600€+ déjà investis sur 6 Blocs + 36 CSV. Inacceptable
# de coder une page sans relier au moins 1 KW Ahrefs validé.

