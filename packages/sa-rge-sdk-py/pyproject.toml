[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sa-rge-sdk"
version = "0.1.0"
description = "Python SDK for the ServicesArtisans RGE-OS public API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ServicesArtisans", email = "data@servicesartisans.fr" }]
keywords = ["rge", "ademe", "renovation", "energetique", "servicesartisans", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.urls]
"Homepage" = "https://servicesartisans.fr/developpeurs"
"Source" = "https://servicesartisans.fr/developpeurs/api-catalog"
"OpenAPI" = "https://servicesartisans.fr/api/v1/openapi/json"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
