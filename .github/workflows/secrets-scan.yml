name: Secrets Scan

# =============================================================================
# Secrets scan — gitleaks bloque tout push/PR contenant un token leak
# =============================================================================
#
# Pourquoi : 6 schema drifts hors-Git en 1 mois + 1 leak Upstash REST token
# dans un chat 2026-05-02 (heureusement non commit). On code en filet pour
# que le prochain "oups" ne quitte jamais la machine du dev.
#
# Modes :
#   - push (master + claude/**) : scan diff entre HEAD~1 et HEAD
#   - pull_request : scan diff entre base et head
#
# Faux positifs : éditer .gitleaks.toml [allowlist], pas le workflow.
# =============================================================================

on:
  push:
    branches: ['master', 'claude/**']
  pull_request:
    branches: ['master']

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (full history for diff scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true
          # Pas de license commerciale requise pour repos publics. Pour repo
          # privé : ajouter `GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}`.
