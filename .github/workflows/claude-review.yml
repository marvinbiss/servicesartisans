name: Claude Code Review

on:
  pull_request:
    branches: ['master']

# Cancel stale runs for the same PR
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─── Gate: standard checks must pass first ─────────────────────────────────
  gate:
    name: Gates (tsc + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*') }}
          restore-keys: nextjs-${{ hashFiles('package-lock.json') }}-

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        env:
          NEXT_BUILD_SKIP_DB: '1'
        run: npx next build

      - name: Smoke tests (non-LLM verification)
        run: |
          # Start the built app in background
          npx next start -p 3777 &
          SERVER_PID=$!

          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:3777/api/health > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          # Run smoke tests against real server
          node scripts/ci/smoke-tests.mjs http://localhost:3777 || SMOKE_FAILED=1

          # Cleanup
          kill $SERVER_PID 2>/dev/null || true

          if [ "$SMOKE_FAILED" = "1" ]; then
            echo "::error::Smoke tests failed — real runtime issues detected"
            exit 1
          fi
        env:
          NEXT_BUILD_SKIP_DB: '1'

  # ─── Risk Router: analyze diff and select agents ───────────────────────────
  risk-router:
    name: Risk Router
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      agents: ${{ steps.route.outputs.agents }}
      skipped: ${{ steps.route.outputs.skipped }}
      risk_level: ${{ steps.route.outputs.risk_level }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Analyze diff and select agents
        id: route
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr-diff.txt
          RESULT=$(node scripts/ci/risk-router.mjs /tmp/pr-diff.txt)

          echo "$RESULT"

          # Extract fields for GitHub outputs
          AGENTS=$(echo "$RESULT" | node -e "
            const r = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            console.log(JSON.stringify(r.agents));
          ")
          SKIPPED=$(echo "$RESULT" | node -e "
            const r = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            console.log(r.skipped.join(','));
          ")
          RISK=$(echo "$RESULT" | node -e "
            const r = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            console.log(r.risk_level);
          ")

          echo "agents=$AGENTS" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
          echo "risk_level=$RISK" >> $GITHUB_OUTPUT

          echo "Risk: $RISK | Agents: $AGENTS | Skipped: $SKIPPED"

  # ─── Parallel Claude Code agents (only selected by risk router) ────────────
  claude-agent:
    name: Claude · ${{ matrix.agent }}
    needs: risk-router
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        agent:
          - security
          - performance
          - accessibility
          - types-validation
          - ux-consistency
          - data-integrity
          - mobile-responsive
          - error-handling
          - seo
          - code-quality

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if agent is selected
        id: check
        run: |
          AGENTS='${{ needs.risk-router.outputs.agents }}'
          if echo "$AGENTS" | node -e "
            const agents = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            process.exit(agents.includes('${{ matrix.agent }}') ? 0 : 1);
          "; then
            echo "selected=true" >> $GITHUB_OUTPUT
          else
            echo "selected=false" >> $GITHUB_OUTPUT
            echo "Agent ${{ matrix.agent }} skipped by risk router"
            echo '{"agent":"${{ matrix.agent }}","findings":[],"skipped":true}' > /tmp/report.json
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.selected == 'true'
        with:
          node-version: 20

      - name: Generate PR diff + context
        if: steps.check.outputs.selected == 'true'
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr-diff.txt
          LINES=$(wc -l < /tmp/pr-diff.txt)
          echo "Diff: $LINES lines"
          if [ "$LINES" -eq 0 ]; then
            echo '{"agent":"${{ matrix.agent }}","findings":[]}' > /tmp/report.json
            echo "SKIP=true" >> $GITHUB_ENV
          fi

          # Build context: CLAUDE.md conventions + recent commits
          echo "" > /tmp/repo-context.txt
          if [ -f CLAUDE.md ]; then
            echo "<project-conventions>" >> /tmp/repo-context.txt
            head -c 8000 CLAUDE.md >> /tmp/repo-context.txt
            echo "</project-conventions>" >> /tmp/repo-context.txt
          fi
          echo "<recent-commits>" >> /tmp/repo-context.txt
          git log --oneline -20 >> /tmp/repo-context.txt
          echo "</recent-commits>" >> /tmp/repo-context.txt

      - name: Run Claude agent — ${{ matrix.agent }}
        if: steps.check.outputs.selected == 'true' && env.SKIP != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          PROMPT=$(cat scripts/ci/agents/${{ matrix.agent }}.md)
          DIFF=$(head -c 90000 /tmp/pr-diff.txt)
          CONTEXT=$(cat /tmp/repo-context.txt)

          FULL_PROMPT=$(cat <<PROMPT_EOF
          $PROMPT

          $CONTEXT

          <pr-diff>
          $DIFF
          </pr-diff>
          PROMPT_EOF
          )

          echo "$FULL_PROMPT" | npx -y @anthropic-ai/claude-code@latest \
            -p \
            --output-format json \
            --max-turns 1 \
            > /tmp/report-raw.json 2>/tmp/claude-stderr.log || true

          node -e "
            const fs = require('fs');
            let raw;
            try {
              raw = fs.readFileSync('/tmp/report-raw.json', 'utf8');
            } catch {
              fs.writeFileSync('/tmp/report.json', JSON.stringify({
                agent: '${{ matrix.agent }}',
                findings: [],
                error: 'No output from Claude'
              }));
              process.exit(0);
            }

            try {
              const parsed = JSON.parse(raw);
              const text = parsed.result || JSON.stringify(parsed);
              const jsonMatch = text.match(/\`\`\`json\s*([\s\S]*?)\`\`\`/)
                || text.match(/(\{[\s\S]*\"findings\"[\s\S]*\})/);
              if (jsonMatch) {
                const report = JSON.parse(jsonMatch[1]);
                fs.writeFileSync('/tmp/report.json', JSON.stringify(report, null, 2));
                process.exit(0);
              }
              if (parsed.agent && parsed.findings) {
                fs.writeFileSync('/tmp/report.json', JSON.stringify(parsed, null, 2));
                process.exit(0);
              }
            } catch {}

            try {
              const direct = JSON.parse(raw);
              if (direct.agent && direct.findings) {
                fs.writeFileSync('/tmp/report.json', JSON.stringify(direct, null, 2));
                process.exit(0);
              }
            } catch {}

            fs.writeFileSync('/tmp/report.json', JSON.stringify({
              agent: '${{ matrix.agent }}',
              findings: [],
              error: 'Could not parse agent output'
            }, null, 2));
          "

          echo "=== Report: ${{ matrix.agent }} ==="
          cat /tmp/report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: claude-report-${{ matrix.agent }}
          path: /tmp/report.json
          retention-days: 7

  # ─── Aggregate all agent reports ───────────────────────────────────────────
  aggregate:
    name: Aggregate & Decide
    needs: [risk-router, claude-agent]
    runs-on: ubuntu-latest
    if: always() && needs.claude-agent.result != 'cancelled'
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          pattern: claude-report-*
          path: /tmp/claude-reports

      - name: Aggregate reports
        id: aggregate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          node scripts/ci/aggregate-reports.mjs /tmp/claude-reports \
            --skipped "${{ needs.risk-router.outputs.skipped }}"

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: claude-metrics
          path: /tmp/claude-metrics.jsonl
          retention-days: 90

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/claude-summary.md', 'utf8');
            const marker = '<!-- claude-review-bot -->';
            const fullBody = marker + '\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: fullBody,
              });
            }

      - name: Fail if blocking issues found
        if: steps.aggregate.outputs.has_blockers == 'true'
        run: |
          echo "::error::Claude Code Review found P0/P1 issues. See PR comment."
          exit 1
