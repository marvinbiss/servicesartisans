name: Claude Code Review

on:
  pull_request:
    branches: ['master']

# Cancel stale runs for the same PR
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─── Gate: standard checks must pass first ─────────────────────────────────
  gate:
    name: Gates (tsc + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        env:
          NEXT_BUILD_SKIP_DB: '1'
        run: npx next build

  # ─── 10 parallel Claude Code AI agents ─────────────────────────────────────
  claude-agent:
    name: Claude · ${{ matrix.agent }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        agent:
          - security
          - performance
          - accessibility
          - types-validation
          - ux-consistency
          - data-integrity
          - mobile-responsive
          - error-handling
          - seo
          - code-quality

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate PR diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr-diff.txt
          LINES=$(wc -l < /tmp/pr-diff.txt)
          echo "Diff: $LINES lines"
          if [ "$LINES" -eq 0 ]; then
            echo '{"agent":"${{ matrix.agent }}","findings":[]}' > /tmp/report.json
            echo "Empty diff — skipping agent"
            echo "SKIP=true" >> $GITHUB_ENV
          fi

      - name: Run Claude agent — ${{ matrix.agent }}
        if: env.SKIP != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          PROMPT=$(cat scripts/ci/agents/${{ matrix.agent }}.md)
          DIFF=$(head -c 100000 /tmp/pr-diff.txt)

          # Build the full prompt with diff injected
          FULL_PROMPT=$(cat <<PROMPT_EOF
          $PROMPT

          <pr-diff>
          $DIFF
          </pr-diff>
          PROMPT_EOF
          )

          # Run Claude Code in headless mode
          echo "$FULL_PROMPT" | npx -y @anthropic-ai/claude-code@latest \
            -p \
            --output-format json \
            --max-turns 1 \
            > /tmp/report-raw.json 2>/tmp/claude-stderr.log || true

          # Parse the JSON output — extract findings from Claude's response
          node -e "
            const fs = require('fs');
            let raw;
            try {
              raw = fs.readFileSync('/tmp/report-raw.json', 'utf8');
            } catch {
              fs.writeFileSync('/tmp/report.json', JSON.stringify({
                agent: '${{ matrix.agent }}',
                findings: [],
                error: 'No output from Claude'
              }));
              process.exit(0);
            }

            // Try parsing as direct JSON
            try {
              const parsed = JSON.parse(raw);
              // Claude --output-format json wraps in {result: '...'}
              const text = parsed.result || JSON.stringify(parsed);

              // Extract JSON from the text
              const jsonMatch = text.match(/\`\`\`json\s*([\s\S]*?)\`\`\`/)
                || text.match(/(\{[\s\S]*\"findings\"[\s\S]*\})/);

              if (jsonMatch) {
                const report = JSON.parse(jsonMatch[1]);
                fs.writeFileSync('/tmp/report.json', JSON.stringify(report, null, 2));
                process.exit(0);
              }

              // Maybe the result itself is the JSON
              if (parsed.agent && parsed.findings) {
                fs.writeFileSync('/tmp/report.json', JSON.stringify(parsed, null, 2));
                process.exit(0);
              }
            } catch {}

            // Try raw text as JSON
            try {
              const direct = JSON.parse(raw);
              if (direct.agent && direct.findings) {
                fs.writeFileSync('/tmp/report.json', JSON.stringify(direct, null, 2));
                process.exit(0);
              }
            } catch {}

            // Fallback
            fs.writeFileSync('/tmp/report.json', JSON.stringify({
              agent: '${{ matrix.agent }}',
              findings: [],
              error: 'Could not parse agent output'
            }, null, 2));
          "

          echo "=== Report: ${{ matrix.agent }} ==="
          cat /tmp/report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: claude-report-${{ matrix.agent }}
          path: /tmp/report.json
          retention-days: 7

  # ─── Aggregate all agent reports ───────────────────────────────────────────
  aggregate:
    name: Aggregate & Decide
    needs: claude-agent
    runs-on: ubuntu-latest
    if: always() && needs.claude-agent.result != 'cancelled'
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          pattern: claude-report-*
          path: /tmp/claude-reports

      - name: Aggregate reports
        id: aggregate
        run: node scripts/ci/aggregate-reports.mjs /tmp/claude-reports

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/claude-summary.md', 'utf8');
            const marker = '<!-- claude-review-bot -->';
            const fullBody = marker + '\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: fullBody,
              });
            }

      - name: Fail if blocking issues found
        if: steps.aggregate.outputs.has_blockers == 'true'
        run: |
          echo "::error::Claude Code Review found P0/P1 issues. See PR comment."
          exit 1
