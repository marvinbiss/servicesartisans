[project]
name = "sa-hf-publish"
version = "0.1.0"
description = "ServicesArtisans HuggingFace dataset publish helper — pilier 6 RGE-OS"
authors = [{ name = "ServicesArtisans" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
  "click>=8.1",
  "rich>=13.0",
  "pyarrow>=15.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
live = ["huggingface-hub>=0.20", "psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
sa-hf-publish = "sa_hf_publish.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sa_hf_publish"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
